<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ROM Action · Hamleys Mystery Audit Intelligence</title>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div class="standalone-main">
    <div class="topbar">
      <div>
        <h1 class="page-title">ROM Action</h1>
        <div class="page-sub">Cases where L&amp;D has triggered an action — add defaulters and route to HRBP</div>
      </div>
      <div class="seg-toggle" id="verticalToggle">
        <button data-v="retail" class="active retail">Retail</button>
        <button data-v="play" class="play">Play</button>
      </div>
    </div>

    <div class="filter-bar">
      <div class="filter-field"><label>ROM</label><select id="fRom"></select></div>
      <span class="small-muted" id="resultCount" style="margin-left:auto;"></span>
    </div>

    <div class="section-head" style="margin-top:6px;">
      <h3>Awaiting Your Action</h3>
    </div>
    <div id="caseListWrap"></div>

    <div class="section-head" style="margin-top:24px;">
      <h3>History — Already Sent to HR</h3>
      <span class="small-muted">Kept here permanently for reference — nothing disappears once actioned</span>
    </div>
    <div id="historyWrap"></div>

</div>

<script src="assets/js/config.js?v=2"></script>
<script src="assets/js/auth.js?v=2"></script>
<script src="assets/js/data.js?v=2"></script>
<script src="assets/js/ui.js?v=2"></script>
<script>
let vertical = "retail";
let currentCases = [];

async function boot() {
  await requireAccess("ROM Action — L&D / ROM Only");
  renderStandaloneHeader("ROM Action", "Add defaulter names & action, then send to HRBP");
  try {
    await HMAI.init();
  } catch (err) {
    showLoadError(err);
    return;
  }

  document.querySelectorAll("#verticalToggle button").forEach(b => {
    b.addEventListener("click", async () => {
      vertical = b.dataset.v;
      document.querySelectorAll("#verticalToggle button").forEach(x => x.classList.remove("active"));
      b.classList.add("active");
      await populateRomFilter();
      await render();
    });
  });
  document.getElementById("fRom").addEventListener("change", render);

  await populateRomFilter();
  await render();
}

async function populateRomFilter() {
  const roms = (await HMAI.getCases()).filter(c => c.vertical === vertical && c.stage === "ld_triggered")
    .map(c => c.rom).filter((v,i,a) => a.indexOf(v) === i).sort();
  fillSelect(document.getElementById("fRom"), roms, "All ROMs");
}

async function render() {
  document.querySelector(".seg-toggle").querySelectorAll("button").forEach(b => b.classList.toggle("active", b.dataset.v === vertical));
  const romFilter = document.getElementById("fRom").value;
  const allCases = await HMAI.getCases();
  let cases = allCases.filter(c => c.vertical === vertical && c.stage === "ld_triggered");
  if (romFilter) cases = cases.filter(c => c.rom === romFilter);
  cases = HMAI.dedupeCasesByStore(cases);
  cases.sort((a,b) => new Date(b.date) - new Date(a.date));

  let history = allCases.filter(c => c.vertical === vertical && (c.stage === "rom_submitted" || c.stage === "hrbp_closed"));
  if (romFilter) history = history.filter(c => c.rom === romFilter);
  history = HMAI.dedupeCasesByStore(history);
  history.sort((a,b) => new Date(b.date) - new Date(a.date));

  document.getElementById("resultCount").textContent = `${cases.length} awaiting \u00b7 ${history.length} in history`;
  currentCases = cases;

  const wrap = document.getElementById("caseListWrap");
  if (!cases.length) {
    wrap.innerHTML = `<div class="card empty-state"><div class="ic">✅</div><h3>Nothing waiting on you right now</h3><p class="small-muted">Cases appear here once L&D triggers an action.</p></div>`;
  } else {
    wrap.innerHTML = cases.map(c => caseCardHtml(c)).join("");
    cases.forEach(c => wireCase(c.key));
  }

  const historyWrap = document.getElementById("historyWrap");
  historyWrap.innerHTML = history.length
    ? history.map(c => historyCardHtml(c)).join("")
    : `<div class="card empty-state"><p class="small-muted">Nothing sent to HR yet.</p></div>`;
}

function historyCardHtml(c) {
  const employees = c.employees || [];
  const stageLabel = c.stage === "hrbp_closed" ? "Closed" : "With HRBP";
  const stageCls = c.stage === "hrbp_closed" ? "good" : "warn";
  return `
  <div class="card" style="margin-bottom:16px; opacity:0.9;">
    <div class="section-head">
      <div>
        <h3>${c.storeName} <span class="small-muted" style="font-weight:400;">(${c.storeCode})</span></h3>
        <span class="tag warn" style="margin-top:6px;">${HMAI.TRIGGER_REASONS[c.triggerReason] || "Reason not set"}</span>
        <span class="tag ${stageCls}" style="margin-top:6px; margin-left:6px;">${stageLabel}</span>
      </div>
      <div style="text-align:right;">
        ${scorePill(c.score)}
        <div class="small-muted" style="margin-top:4px;">${fmtDate(c.date)} &middot; ROM: ${c.rom} &middot; SD: ${c.sd} &middot; HRBP: ${c.hrbp || "—"}</div>
      </div>
    </div>
    <hr class="hr">
    <div class="table-wrap">
      <table>
        <thead><tr><th>Employee Name</th><th>Designation</th><th>Employee Code</th><th>Action</th><th>Received</th><th>Actioned</th><th>Status</th></tr></thead>
        <tbody>
          ${employees.map(e => `<tr>
            <td>${e.name}</td><td>${e.designation}</td><td>${e.code}</td><td>${e.action}</td>
            <td class="small-muted">${fmtDate(e.addedAt)}</td>
            <td class="small-muted">${e.closed ? fmtDate(e.closedAt) : "—"}</td>
            <td>${e.closed ? `<span class="tag good">Closed by ${e.closedBy || "HRBP"}</span>` : `<span class="tag warn">Pending with HRBP</span>`}</td>
          </tr>`).join("")}
        </tbody>
      </table>
    </div>
  </div>`;
}

function caseCardHtml(c) {
  const employees = c.employees || [];
  return `
  <div class="card" style="margin-bottom:16px;" id="card_${c.key}">
    <div class="section-head">
      <div>
        <h3>${c.storeName} <span class="small-muted" style="font-weight:400;">(${c.storeCode})</span></h3>
        <span class="tag warn" style="margin-top:6px;">${HMAI.TRIGGER_REASONS[c.triggerReason] || "Reason not set"}</span>
      </div>
      <div style="text-align:right;">
        ${scorePill(c.score)}
        <div class="small-muted" style="margin-top:4px;">${fmtDate(c.date)} &middot; ROM: ${c.rom} &middot; SD: ${c.sd}</div>
      </div>
    </div>
    <hr class="hr">
    <div class="table-wrap">
      <table>
        <thead><tr><th>Employee Name</th><th>Designation</th><th>Employee Code</th><th>Action</th><th>Received</th><th></th></tr></thead>
        <tbody id="empBody_${c.key}">
          ${employees.map(e => empRowHtml(e, c.key)).join("")}
        </tbody>
      </table>
    </div>
    <div style="display:flex; gap:10px; margin-top:14px; flex-wrap:wrap; align-items:flex-end;">
      <div class="field-row" style="margin:0;"><label>Name</label><input type="text" id="name_${c.key}" placeholder="Employee name"></div>
      <div class="field-row" style="margin:0; min-width:190px;">
        <label>Designation</label>
        <select id="desig_${c.key}" onchange="applySuggestedAction('${c.key}')">
          <option value="">Select…</option>
          ${HMAI.EMPLOYEE_DESIGNATIONS.map(d => `<option value="${d.value}">${d.label}</option>`).join("")}
        </select>
      </div>
      <div class="field-row" style="margin:0;"><label>Employee Code</label><input type="text" id="code_${c.key}" placeholder="e.g. HML1234"></div>
      <div class="field-row" style="margin:0; min-width:260px;">
        <label>Action <span id="actionHint_${c.key}" class="small-muted"></span></label>
        <select id="action_${c.key}">
          <option value="">Select action…</option>
          ${HMAI.ROM_ACTIONS.map(a => `<option value="${a}">${a}</option>`).join("")}
        </select>
      </div>
      <button class="btn btn-navy btn-sm" onclick="addEmployeeRow('${c.key}')">+ Add</button>
    </div>
    <p class="small-muted" style="margin-top:8px;">Pick the employee's designation and the correct action is suggested automatically, based on ${HMAI.TRIGGER_REASONS[c.triggerReason] || "the trigger reason"} — you can still change it if needed.</p>
    <div style="display:flex; justify-content:flex-end; margin-top:16px;">
      <button class="btn btn-primary" onclick="sendToHr('${c.key}', this)">Send to HR</button>
    </div>
  </div>`;
}

// Auto-fills the Action dropdown to match the policy for this designation +
// this case's trigger reason. If the combination has no defined policy
// (e.g. an FC already terminated at first offense has no "second offense"
// rule), the Action is left for the ROM to pick manually, with a note.
function applySuggestedAction(key) {
  const desigSel = document.getElementById(`desig_${key}`);
  const actionSel = document.getElementById(`action_${key}`);
  const hint = document.getElementById(`actionHint_${key}`);
  const desig = desigSel.value;
  if (!desig) { hint.textContent = ""; return; }
  const c = currentCases.find(x => x.key === key);
  const suggested = c ? HMAI.suggestAction(desig, c.triggerReason) : null;
  if (suggested) {
    actionSel.value = suggested;
    hint.textContent = "— auto-suggested";
    hint.style.color = "var(--good)";
  } else {
    actionSel.value = "";
    hint.textContent = "— no standard policy for this combination, please select manually";
    hint.style.color = "var(--hamleys-red)";
  }
}

function empRowHtml(e, key) {
  return `<tr id="emprow_${e.id}">
    <td>${e.name}</td><td>${e.designation}</td><td>${e.code}</td><td>${e.action}</td>
    <td class="small-muted">${fmtDate(e.addedAt)}</td>
    <td><button class="btn btn-ghost btn-sm" onclick="removeEmployeeRow('${key}','${e.id}')">Remove</button></td>
  </tr>`;
}

function wireCase(key) {
  // Enter key adds a row from the name field for convenience
  const nameInput = document.getElementById(`name_${key}`);
  if (nameInput) nameInput.addEventListener("keydown", e => { if (e.key === "Enter") addEmployeeRow(key); });
}

async function addEmployeeRow(key) {
  const name = document.getElementById(`name_${key}`).value.trim();
  const desigSel = document.getElementById(`desig_${key}`);
  const designation = desigSel.selectedOptions[0] ? desigSel.selectedOptions[0].text.trim() : "";
  const code = document.getElementById(`code_${key}`).value.trim();
  const action = document.getElementById(`action_${key}`).value;
  if (!name || !desigSel.value || !code || !action) {
    toast("Fill in name, designation, employee code and action before adding");
    return;
  }
  await HMAI.addEmployee(key, { name, designation, code, action });
  await render();
}

async function removeEmployeeRow(key, empId) {
  await HMAI.removeEmployee(key, empId);
  await render();
}

async function sendToHr(key, btn) {
  btn.disabled = true; btn.textContent = "Sending…";
  try {
    await HMAI.sendToHR(key);
    toast("Sent to HRBP — live for everyone now");
    await render();
  } catch (err) {
    toast(err.message || "Couldn't send to HR");
    btn.disabled = false; btn.textContent = "Send to HR";
  }
}

boot();
</script>
</body>
</html>
